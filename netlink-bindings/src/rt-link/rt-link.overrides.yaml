definitions:
  - name: br-boolopt-multi
    members:
      -
        name: optval
        enum: br-boolopt-id
      -
        name: optmask
        enum: br-boolopt-id

  - name: br-boolopt-id
    type: flags
    header: linux/if_bridge.h
    entries:
      -
        name: no-ll-learn
        doc: disable learning from link-local packets
      -
        name: mcast-vlan-snooping
        doc: control vlan multicast snooping
      -
        name: mst-enable
      -
        name: mdb-offload-fail-notification
      -
        name: fdb-local-vlan-0
        doc: >-
          local FDB entries installed by the bridge driver itself should only
          be added on VLAN 0

  - name: if-oper-state
    enum-name: if-oper-state
    name-prefix: if-oper-
    type: enum
    header: linux/if.h
    entries:
      - unknown
      - notpresent
      - down
      - lowerlayerdown
      - testing
      - dormant
      - up

attribute-sets:
  -
    name: link-attrs
    attributes:
      -
        name: operstate
        enum: if-oper-state

  -
    name: linkinfo-bridge-attrs
    attributes:
      -
        name: vlan-protocol
        byte-order: big-endian
