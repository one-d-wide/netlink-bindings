operations:
  fallback-attrs: nl80211-attrs
  transparent: true
definitions:
  - name: iftype
    type: enum
    entries:
      - adhoc
      - station
      - ap
      - ap-vlan
      - wds
      - monitor
      - mesh-point
      - p2p-client
      - p2p-go
      - p2p-device
      - ocb
      - nan
      - nan-data
      - pd
  - name: sta-flag
    type: enum
    entries:
      - authorized
      - short-preamble
      - wme
      - mfp
      - authenticated
      - tdls-peer
      - associated
      - spp-amsdu
  - name: sta-flag-update
    type: struct
    members:
      - name: mask
        type: u32
        enum: sta-flag
        enum-as-flags: true
      - name: set
        type: u32
        enum: sta-flag
        enum-as-flags: true
