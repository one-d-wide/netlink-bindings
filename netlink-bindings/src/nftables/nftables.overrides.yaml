# /* make sure not to change this without changing nf_log.h:NF_LOG_* (!) */
# #define XT_LOG_TCPSEQ		0x01	/* Log TCP sequence numbers */
# #define XT_LOG_TCPOPT		0x02	/* Log TCP options */
# #define XT_LOG_IPOPT		0x04	/* Log IP options */
# #define XT_LOG_UID		0x08	/* Log UID owning local socket */
# #define XT_LOG_NFLOG		0x10	/* Unsupported, don't reuse */
# #define XT_LOG_MACDECODE	0x20	/* Decode MAC header */
# #define XT_LOG_MASK		0x2f
#
# struct xt_log_info {
# 	unsigned char level;
# 	unsigned char logflags;
# 	char prefix[30];
# };
#
  -
    name: xt-log-info
    type: struct
    members:
      -
        name: level
        type: u8
        enum: log-level
      -
        name: logflags
        type: u8
        enum: xt-log-flag
      -
        name: prefix
        doc: null-terminated C-string
        type: binary
        len: 30
        display-hint: string
  -
    name: xt-log-flag
    type: flags
    header: linux/netfilter/xt_LOG.h
    entries:
      -
        name: tcpseq
        doc: Log TCP sequence numbers
      -
        name: tcpopt
        doc: Log TCP options
      -
        name: ipopt
        doc: Log IP options
      -
        name: uid
        doc: UID owning local socket
      -
        name: nflog
        doc: Unsupported, don't reuse
      -
        name: macdecode
        doc: Decode MAC header

attribute-sets:
  -
    name: expr-target-attrs
    attributes:
      -
        name: info
        doc: |
          This attribute is usually carries struct. Unlike other sub-messages,
          its type depend on values of **both** name and rev.

          Grep for ``static struct xt_target`` in ``linux/net/nftables``.

operations:
  fixed-header: nfgenmsg
  fallback-attrs: rule-attrs
  list:
    -
      name: batch-begin
      no-ack: true
    -
      name: batch-end
      no-ack: true
    -
      # Defined as nfnl_compat_subsys in net/netfilter/nft_compat.c
      name: getcompat
      attribute-set: compat-attrs
      fixed-header: nfgenmsg
      doc: Get / dump nft_compat info
      do:
        request:
          value: 0xb00
          attributes:
            - name
            - rev
            - type
        reply:
          value: 0xb00
          attributes:
            - name
            - rev
            - type
      dump:
        reply:
          attributes:
            - name
            - rev
            - type
