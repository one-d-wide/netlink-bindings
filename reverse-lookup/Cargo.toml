[package]
name = "reverse-lookup"
version.workspace = true
authors = [ "Remy D. Farley <one-d-wide@protonmail.com>" ]
categories = [ "network-programming", "os", "api-bindings" ]
repository = "https://github.com/one-d-wide/netlink-bindings"
license = "MIT OR Apache-2.0"
edition = "2021"

[[bin]]
name = "reverse-lookup"

[dependencies]
libc = "0.2"
netlink-bindings = { workspace = true, features = [ "nlctrl" ] }
netlink-socket2 = { workspace = true }

argh = { version = "0", default-features = false, features = [ "help" ] }

[features]
# Generated by collect_subsystems.sh script. Do not modify.
binder = [ "netlink-bindings/binder" ]
conntrack = [ "netlink-bindings/conntrack" ]
dev-energymodel = [ "netlink-bindings/dev-energymodel" ]
devlink = [ "netlink-bindings/devlink" ]
dpll = [ "netlink-bindings/dpll" ]
drm-ras = [ "netlink-bindings/drm-ras" ]
ethtool = [ "netlink-bindings/ethtool" ]
fou = [ "netlink-bindings/fou" ]
handshake = [ "netlink-bindings/handshake" ]
inet-diag = [ "netlink-bindings/inet-diag" ]
lockd = [ "netlink-bindings/lockd" ]
mptcp_pm = [ "netlink-bindings/mptcp_pm" ]
netdev = [ "netlink-bindings/netdev" ]
net-shaper = [ "netlink-bindings/net-shaper" ]
nfsd = [ "netlink-bindings/nfsd" ]
nftables = [ "netlink-bindings/nftables" ]
nl80211 = [ "netlink-bindings/nl80211" ]
nlctrl = [ "netlink-bindings/nlctrl" ]
ovpn = [ "netlink-bindings/ovpn" ]
ovs_datapath = [ "netlink-bindings/ovs_datapath" ]
ovs_flow = [ "netlink-bindings/ovs_flow" ]
ovs_packet = [ "netlink-bindings/ovs_packet" ]
ovs_vport = [ "netlink-bindings/ovs_vport" ]
psp = [ "netlink-bindings/psp" ]
rt-addr = [ "netlink-bindings/rt-addr" ]
rt-link = [ "netlink-bindings/rt-link" ]
rt-neigh = [ "netlink-bindings/rt-neigh" ]
rt-route = [ "netlink-bindings/rt-route" ]
rt-rule = [ "netlink-bindings/rt-rule" ]
sunrpc = [ "netlink-bindings/sunrpc" ]
tc = [ "netlink-bindings/tc" ]
tcp_metrics = [ "netlink-bindings/tcp_metrics" ]
team = [ "netlink-bindings/team" ]
unix-diag = [ "netlink-bindings/unix-diag" ]
wireguard = [ "netlink-bindings/wireguard" ]

all-subsystems = [
  "binder",
  "conntrack",
  "dev-energymodel",
  "devlink",
  "dpll",
  "drm-ras",
  "ethtool",
  "fou",
  "handshake",
  "inet-diag",
  "lockd",
  "mptcp_pm",
  "netdev",
  "net-shaper",
  "nfsd",
  "nftables",
  "nl80211",
  "nlctrl",
  "ovpn",
  "ovs_datapath",
  "ovs_flow",
  "ovs_packet",
  "ovs_vport",
  "psp",
  "rt-addr",
  "rt-link",
  "rt-neigh",
  "rt-route",
  "rt-rule",
  "sunrpc",
  "tc",
  "tcp_metrics",
  "team",
  "unix-diag",
  "wireguard",
]
